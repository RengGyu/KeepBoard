<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KeepBoard · 수정 후 사진·배치 비교</title><style>*{box-sizing:border-box}body{margin:0;color:#16305c;background:#eef2f6;font:14px/1.5 system-ui,sans-serif}header,nav,.note,footer{padding:8px 14px}h1{font-size:19px;margin:0}header p{font-size:12px;margin:3px 0}nav{display:flex;gap:5px;overflow:auto;background:#fff}button,a{font:inherit;color:inherit}button{white-space:nowrap;background:#fff;border:1px solid #acbdd0;border-radius:6px;min-height:32px;padding:4px 9px;cursor:pointer}button[aria-pressed=true]{color:#fff;background:#16305c}.compare{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;padding:0 10px}.pane{min-width:0;background:#fff;border:1px solid #bdcad8;border-radius:8px;overflow:hidden}.tools{display:flex;gap:5px;align-items:center;flex-wrap:wrap;padding:6px;border-bottom:1px solid #d8e0e9}.tools strong{margin-right:auto}.tools button,.tools a{font-size:12px}.view{height:calc(100dvh - 225px);min-height:240px;overflow:auto;padding:6px;touch-action:pan-x pan-y;background:#e9eef3}.view img{display:block;max-width:none;user-select:none}.note,footer{font-size:12px;color:#536278}@media(max-width:600px){header{padding:7px 10px}h1{font-size:17px}.compare{padding:0 5px;gap:5px}.tools strong{width:100%}.tools{gap:3px;padding:4px}.tools button{padding:3px 5px}.view{padding:3px;height:calc(100dvh - 265px)}nav{padding:6px}}@media(max-height:500px){header p{display:none}header,nav,.note,footer{padding:3px 10px}.view{height:calc(100dvh - 165px);min-height:140px}}</style><header><h1>원사진과 수정 후 배치</h1><p>왼쪽 원사진 · 오른쪽 실제 제품 작업면. 확대 후 가로·세로로 이동할 수 있습니다.</p></header><nav aria-label="게임 선택"></nav><p class="note"></p><main class="compare"></main><footer>기존 8종 저장 응답 · 새 판독 0회 · 실제 작업면 전체 PNG(내보내기용 clipping 해제). 숫자는 관측 수이며 위치 정답 수가 아닙니다.</footer><script>const games=[{"id":"rummikub","name":"루미큐브","observations":58,"photo":"assets/rummikub-photo.jpg","service":"assets/rummikub-service.png","photoSHA":"e874ac37c98c1b8ab5758fbe2c5f6c3e9d91f3527a1187deb5ff454a19a1f6c9","serviceSHA":"f104fa4da35b62378756937249da27fe4fca8b22781093d988051f3e9a4e1c08","note":"기존 전용 화면의 사진 9줄과 원 타일 58개를 유지했습니다."},{"id":"hanabi","name":"하나비","observations":35,"photo":"assets/hanabi-photo.jpg","service":"assets/hanabi-service.png","photoSHA":"42c88a8f34e9cd3fff9358978f90342ffc122c6ab10047d05cd821a0eff0a1b7","serviceSHA":"d2356bb401fed31ba534f93ea4eb3bb9c0c24337b1a0734b9a41e23dc3262ae8","note":"기존 위치를 사진 5줄로 표시합니다. 불꽃더미의 실제 색별 역할·순서 확정과는 구분합니다."},{"id":"azul","name":"아줄","observations":22,"photo":"assets/azul-photo.jpg","service":"assets/azul-service.png","photoSHA":"ba0d32483267410e3e70f9fe5d5a99ff1071d37e3ed369e5b804afcac1a5db20","serviceSHA":"2d83b97fc0f5112a58095e796b4d6081c91c9380350a5a793fb97946512e1bab","note":"판 3개와 타일 19개를 여러 사진 줄로 표시합니다. 읽히지 않은 벽·패턴 칸을 임의로 채우지 않습니다."},{"id":"carcassonne","name":"카르카손","observations":43,"photo":"assets/carcassonne-photo.jpg","service":"assets/carcassonne-service.png","photoSHA":"d9c52223ea0e69300cd309b0bbc985d0c69b5325b8ff877dfed90c8f1b440024","serviceSHA":"85c66d4b4ad3379d3a69e8b8388a725c7926426f12b001a529462fda9fd7dc2a","note":"기존 bbox를 여러 사진 줄로 표시합니다. 원응답에 없는 타일 연결·지도 좌표의 복원을 뜻하지 않습니다."},{"id":"dominion","name":"도미니언","observations":49,"photo":"assets/dominion-photo.jpg","service":"assets/dominion-service.png","photoSHA":"9413ecb2d772bc0ee937538cf228ed75e8d403f8303a3356df0a099ede6389b1","serviceSHA":"672c42a211df320ad481790e1ac59456319d271e7965cd9134e3ba58c85c869b","note":"기존 관측 49개를 여러 사진 줄로 표시합니다. 실제 더미 수·가려진 장수를 새로 확정하지 않습니다."},{"id":"sagrada","name":"사그라다","observations":42,"photo":"assets/sagrada-photo.jpg","service":"assets/sagrada-service.png","photoSHA":"94368d0c2f995914b9e857ceafa04afbfaff112c2b309ee082a4d2d4ac7a4feb","serviceSHA":"5be4cf9805d9f4cea36c327a569b0a691c2962aeffe41674e8cdbfc7e273da4f","note":"기존 정식 18칸과 원 주사위 값·빈칸을 보존합니다. 다른 구성물은 기존 추정 경로를 재사용합니다."},{"id":"lost-cities","name":"로스트 시티","observations":42,"photo":"assets/lost-cities-photo.jpg","service":"assets/lost-cities-service.png","photoSHA":"d6abc06aca6feda5f747803aca9df403e93fddf8acd807c8b5e654afb11c78cc","serviceSHA":"b26b80f00764c92d0e0040396c549709236a8e9e21d9f7284230195a733b3e6f","note":"중앙판·양편·버림 표시와 원 카드 42개를 유지합니다. 이번 표시는 새 사진 정확도 검증이 아닙니다."},{"id":"seven-wonders","name":"세븐 원더스","observations":117,"photo":"assets/seven-wonders-photo.jpg","service":"assets/seven-wonders-service.png","photoSHA":"ea5f475396df0714f212b4440bb18215b85fbcc717d103d48ce59db98fbbbd14","serviceSHA":"bc1be759cccba6cd6405f3809a3a80a1e1f985313d991c41b8aadc85888000d6","note":"기존 판 연결·미연결 117개를 누락 없이 표시합니다. 떨어진 묶음의 판 소속을 새로 확정하지 않습니다."}];const nav=document.querySelector('nav');function openGame(id){const g=games.find(g=>g.id===id)||games[0];location.hash=g.id;nav.replaceChildren(...games.map(x=>{const b=document.createElement('button');b.textContent=x.name;b.setAttribute('aria-pressed',String(x.id===g.id));b.onclick=()=>openGame(x.id);return b}));document.querySelector('.note').textContent=g.name+' · '+g.observations+'개 관측 · '+g.note;const main=document.querySelector('main');main.replaceChildren(...[['원사진',g.photo],['수정 후 서비스',g.service]].map(([name,src])=>{const s=document.createElement('section');s.className='pane';const tools=document.createElement('div');tools.className='tools';const label=document.createElement('strong');label.textContent=name;tools.append(label);const view=document.createElement('div');view.className='view';view.setAttribute('tabindex','0');const img=new Image();img.alt=g.name+' '+name;img.src=src;let scale=1;function resize(){img.style.width=(img.naturalWidth*scale)+'px';img.style.height='auto'}for(const [text,action]of [['전체',()=>{scale=Math.min(1,(view.clientWidth-12)/img.naturalWidth,(view.clientHeight-12)/img.naturalHeight);resize();view.scrollTo(0,0)}],['100%',()=>{scale=1;resize()}],['−',()=>{scale=Math.max(.05,scale/1.4);resize()}],['+',()=>{scale=Math.min(4,scale*1.4);resize()}]]){const b=document.createElement('button');b.textContent=text;b.onclick=action;tools.append(b);if(text==='전체')img.onload=action}const link=document.createElement('a');link.href=src;link.target='_blank';link.textContent='원본 크기';tools.append(link);view.append(img);s.append(tools,view);return s}))}openGame(location.hash.slice(1));</script></html>
