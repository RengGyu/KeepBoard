ass="bf-leg" d="m43 81 6 30m140-13-4 17M87 104v14"></path><g><path class="bf-paper" d="m74 53 52-5 25 17-52 6Z"></path><circle class="bf-glass" cx="133" cy="49" r="22"></circle><path class="bf-handle" d="m150 66 19 20"></path><path class="bf-seam" d="m122 48 7-7m-16 39 13-1"></path></g></svg><svg class="" x="480" y="65" width="150" height="150" viewBox="0 0 240 132"><ellipse class="bf-ground" cx="119" cy="117" rx="91" ry="8"></ellipse><path class="bf-table" d="m27 63 130-9 56 30-131 12Z"></path><path class="bf-wood" d="m27 63 55 33 131-12v8L82 105 27 72Z"></path><path class="bf-leg" d="m43 81 6 30m140-13-4 17M87 104v14"></path><g><path class="bf-box" d="m80 44 58-5 17 17-58 6Z"></path><path class="bf-paper" d="m80 44 17 18v28L80 74Zm17 18 58-6v28l-58 6Z"></path><path class="bf-return" d="M115 48a18 18 0 1 1-8 22m8-22-1 12 12-2"></path></g></svg><svg class="" x="670" y="65" width="230" height="155" viewBox="0 0 160 108"><path class="bf-table" d="m16 64 77-10 53 25-78 13Z"></path><path class="bf-wood" d="m16 64 52 28 78-13v6L68 99 16 71Z"></path><path class="bf-board" d="m37 65 51-7 36 17-51 9Z"></path><path class="bf-seam" d="m53 63 35 17m-21-20 34 17m-56-8 51-7m-36 15 51-7"></path><path class="bf-accent-piece" d="m76 66 6-6 6 6v8H76Z"></path><g transform="rotate(-8 83 27)"><rect class="bf-phone" x="65" y="6" width="37" height="43" rx="6"></rect><rect class="bf-board" x="71" y="13" width="25" height="26" rx="2"></rect><circle class="bf-phone-dot" cx="83" cy="44" r="1.4"></circle></g><path class="bf-hand" d="m110 55-5-14c-2-5-7-4-7 0l1 8-7-6c-5-4-10 2-6 6l9 10 5 9 13 5 10-10 18 8"></path><path class="bf-guide" d="m57 40-8 14m58-12 8 13"></path></svg><svg class="board-loader-mark" x="65" y="300" width="60" height="60" viewBox="0 0 32 32"><path class="board-loader-hex" d="m16 1 13 7.5v15L16 31 3 23.5v-15Z"></path><g class="board-loader-die"><rect x="7" y="7" width="18" height="18" rx="4"></rect><circle cx="12" cy="12" r="1.7"></circle><circle cx="20" cy="12" r="1.7"></circle><circle cx="16" cy="16" r="1.7"></circle><circle cx="12" cy="20" r="1.7"></circle><circle cx="20" cy="20" r="1.7"></circle></g></svg><svg class="board-loader-mark" x="170" y="320" width="24" height="24" viewBox="0 0 32 32"><path class="board-loader-hex" d="m16 1 13 7.5v15L16 31 3 23.5v-15Z"></path><g class="board-loader-die"><rect x="7" y="7" width="18" height="18" rx="4"></rect><circle cx="12" cy="12" r="1.7"></circle><circle cx="20" cy="12" r="1.7"></circle><circle cx="16" cy="16" r="1.7"></circle><circle cx="12" cy="20" r="1.7"></circle><circle cx="20" cy="20" r="1.7"></circle></g></svg><svg class="feedback-sheet-save" x="330" y="285" width="160" height="120" viewBox="0 0 180 96"><ellipse class="bf-ground" cx="90" cy="83" rx="68" ry="6"></ellipse><path class="bf-box" d="m70 42 29-8 29 17-29 9-29-18v25l29 17 29-9V51"></path><g class="board-event-pieces"><rect class="bf-paper" x="30" y="24" width="22" height="31" rx="3" transform="rotate(-12 41 39)"></rect><path class="bf-seam" d="m36 33 10-2m-9 10 10-2"></path><path class="bf-accent-piece" d="m48 59 11-12 11 12v16H48Z"></path><path class="bf-wood" d="m133 31 10-5 10 6-10 6Z"></path><path class="bf-box" d="m133 31 10 7v12l-10-7m10-5 10-6v12l-10 6"></path></g><path class="bf-box-front" d="m70 42 29 18 29-9v24l-29 9-29-17Z"></path><g class="board-event-lid"><path class="bf-paper" d="m65 41 35-10 33 18-35 11Z"></path><path class="bf-wood" d="m65 41 33 19 35-11v7l-35 11-33-19Z"></path></g><path class="board-event-check" d="m85 68 6 6 12-13"></path></svg><svg class="board-event-reopen feedback-sheet-reopen" x="485" y="285" width="160" height="120" viewBox="0 0 180 96"><ellipse class="bf-ground" cx="90" cy="83" rx="68" ry="6"></ellipse><path class="bf-box" d="m70 42 29-8 29 17-29 9-29-18v25l29 17 29-9V51"></path><g class="board-event-pieces"><rect class="bf-paper" x="30" y="24" width="22" height="31" rx="3" transform="rotate(-12 41 39)"></rect><path class="bf-seam" d="m36 33 10-2m-9 10 10-2"></path><path class="bf-accent-piece" d="m48 59 11-12 11 12v16H48Z"></path><path class="bf-wood" d="m133 31 10-5 10 6-10 6Z"></path><path class="bf-box" d="m133 31 10 7v12l-10-7m10-5 10-6v12l-10 6"></path></g><path class="bf-box-front" d="m70 42 29 18 29-9v24l-29 9-29-17Z"></path><g class="board-event-lid"><path class="bf-paper" d="m65 41 35-10 33 18-35 11Z"></path><path class="bf-wood" d="m65 41 33 19 35-11v7l-35 11-33-19Z"></path></g><path class="board-event-check" d="m85 68 6 6 12-13"></path></svg><svg class="" x="675" y="300" width="58" height="58" viewBox="0 0 120 120"><title>마을</title><g stroke="var(--art-ink, #33483c)" stroke-width="1.7" stroke-linejoin="round"><path d="m20 57 26-29 24-12 26 29v39L72 97H20Z" fill="#bc6048"></path><path d="m46 28 24-12 26 29-24 13Z" fill="var(--art-cream, #fff9e9)" opacity=".2" stroke="none"></path><path d="m72 58 24-13v39L72 97Z" fill="#1d3529" opacity=".21" stroke="none"></path><path d="m20 57 26-29 26 30v39m0-39 24-13M46 28l24-12" fill="none"></path><path d="m25 57 21-23 19 21M26 66v24h37" fill="none" stroke="var(--art-cream, #fff9e9)" opacity=".38" stroke-width="1.5"></path><path d="M33 72h21m-20 8h15m29-15 11-6m-10 17 10-6" stroke="#20392d" opacity=".2" stroke-width="1"></path></g></svg><svg class="board-turn-mark" x="733" y="307" width="25" height="25" viewBox="0 0 20 20"><rect x="2.5" y="2.5" width="15" height="15" rx="4"></rect><circle cx="6.5" cy="6.5" r="1.3"></circle><circle cx="10" cy="10" r="1.3"></circle><circle cx="13.5" cy="13.5" r="1.3"></circle></svg><svg class="" x="805" y="300" width="58" height="58" viewBox="0 0 120 120"><title>선 미플</title><g><ellipse cx="61" cy="110" rx="31" ry="3.5" fill="#7d7857" opacity=".18"></ellipse><g stroke-linejoin="round"><path d="M48 40C39 35 39 22 45 16 52 8 65 8 73 15 80 23 77 36 68 40L72 47 92 49Q100 50 99 57T90 64L77 63 86 98Q88 105 80 106H66L60 83 54 106H40Q32 105 34 98L43 63 29 64Q21 64 20 57T27 49L47 47Z" transform="translate(3 4)" fill="#53634a" stroke="var(--art-ink, #33483c)" stroke-width="1