<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470"><style>:root{--surface:#fff;--surface-2:#f2f6fc;--line:#dfe6f1;--line-2:#c7d2e3;--ink-2:#34425e;--muted:#5d6b82;--accent:#1f6feb;--accent-soft:#e3efff;--accent-ink:#1557c0;--ok:#08705f}/* Quiet, local feedback. No board/editor surface is animated or intercepted. */
.board-loader-mark{display:inline-block;flex-shrink:0;overflow:visible;vertical-align:middle;color:var(--accent);pointer-events:none}
.board-loader-hex{fill:var(--accent-soft);stroke:none}
.board-loader-die{transform-origin:16px 16px;animation:board-dice-roll 1.1s cubic-bezier(.4,0,.25,1) infinite}
.board-loader-die rect{fill:var(--surface);stroke:currentColor;stroke-width:1.5}
.board-loader-die circle{fill:currentColor}

.board-empty-art{width:220px;max-width:100%;height:auto;display:block;margin:0 auto 14px;pointer-events:none}
.empty.board-empty .empty-mark{display:block;width:auto;height:auto;background:none;border-radius:0;margin:0}
.board-empty-art,.board-capture-help svg,.board-event svg{--bf-paper:#fff8e7;--bf-wood:#cba97c;--bf-box:#ead5ae;--bf-outline:var(--ink-2);stroke:var(--bf-outline);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.bf-ground{fill:var(--line);stroke:none;opacity:.5}
.bf-table{fill:var(--surface-2)}
.bf-wood{fill:var(--bf-wood)}
.bf-leg{fill:none;stroke:var(--line-2);stroke-width:4}
.bf-paper{fill:var(--bf-paper)}
.bf-box,.bf-box-front{fill:var(--bf-box)}
.bf-seam{fill:none;stroke:var(--muted);stroke-width:1.2}
.bf-accent-piece{fill:var(--accent);stroke:var(--accent-ink)}
.bf-glass{fill:var(--surface);fill-opacity:.8;stroke:var(--accent);stroke-width:4}
.bf-handle{stroke:var(--accent);stroke-width:7}
.bf-return{fill:none;stroke:var(--accent);stroke-width:3}
.bf-board{fill:var(--accent-soft)}
.bf-phone{fill:var(--surface);stroke:var(--ink-2);stroke-width:2.5}
.bf-phone-dot{fill:var(--muted);stroke:none}
.bf-hand{fill:var(--bf-paper)}
.bf-guide{fill:none;stroke:var(--accent);stroke-dasharray:3 4}
.board-capture-help{display:flex;align-items:center;gap:14px;margin:0 0 16px;pointer-events:none}
.board-capture-help svg{width:128px;height:auto;flex:0 0 128px}
.board-capture-help figcaption{display:grid;gap:5px;min-width:0;color:var(--ink-2);font-size:14px;line-height:1.5}
.board-capture-help figcaption span{color:var(--muted);font-size:13px}
.board-turn-mark{display:inline-flex;align-items:center;flex-shrink:0;color:var(--accent);line-height:1}
.board-turn-mark rect{fill:var(--accent-soft);stroke:currentColor;stroke-width:1.5}
.board-turn-mark circle{fill:currentColor}
.board-event{position:fixed;z-index:80;top:84px;right:22px;width:154px;height:84px;pointer-events:none;user-select:none;animation:board-event-fade 800ms both}
.board-event svg{display:block;width:100%;height:100%;overflow:visible}
.board-event-pieces{transform-origin:99px 58px;animation:board-pack-pieces 800ms both}
.board-event-lid{transform-origin:99px 49px;animation:board-pack-lid 800ms both}
.board-event-check{fill:none;stroke:var(--ok);stroke-width:4}
.board-event-reopen .board-event-pieces{animation-direction:reverse}
.board-event-reopen .board-event-lid{animation-direction:reverse}
.board-event-reopen .board-event-check{display:none}



