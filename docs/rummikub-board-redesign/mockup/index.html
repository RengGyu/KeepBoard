<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>루미큐브 보드 시안 · 공용판·내 받침대</title>
<style>
:root{--bg:#eef3fa;--surface:#fff;--surface-2:#f2f6fc;--surface-3:#e2e9f4;--line:#dfe6f1;--line-2:#c7d2e3;--ink:#14213d;--ink-2:#34425e;--muted:#5d6b82;--accent:#1f6feb;--accent-soft:#e3efff;
 --red:#be443a;--blue:#286eb6;--black:#303844;--orange:#ce7525;--table:#efe7d4;--table-line:#d8cba9;--wood:#b99a6b}
*{box-sizing:border-box}
body{margin:0;font-family:'DM Sans','Noto Sans KR',system-ui,sans-serif;color:var(--ink);background:#d9e1ec;display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px 0 40px}
button{font:inherit;color:inherit}
/* 시안 상태 선택 (폰 밖) */
.states{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:720px}
.states a{padding:7px 12px;border-radius:999px;background:#fff;color:var(--ink-2);text-decoration:none;font-size:14px;border:1px solid var(--line-2)}
.states a[aria-current=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.disclose{font-size:12.5px;color:var(--muted);max-width:390px;text-align:center;margin:0}
/* 폰 */
.phone{width:390px;height:844px;background:var(--bg);border-radius:28px;overflow:hidden;position:relative;box-shadow:0 18px 50px rgba(20,33,61,.22);display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;padding:14px 14px 8px;background:var(--surface)}
.icon{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex-shrink:0;cursor:pointer}
.icon svg{width:20px;height:20px}
.title{flex:1;min-width:0}.title h1{margin:0;font-size:18px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.title p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:4px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:11px 12px;min-height:44px;font-size:15px;color:var(--muted);box-shadow:inset 0 -3px 0 transparent;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);font-weight:700;box-shadow:inset 0 -3px 0 var(--accent)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.body{flex:1;overflow:auto;padding:14px 14px 96px}
/* 타일 (기존 자산을 잘라 씀: viewBox가 타일 몸체만 보이게) */
.tile{display:block;flex-shrink:0;cursor:pointer;border-radius:4px}
.tile svg{display:block;width:100%;height:100%;overflow:visible}
.tile.sel{outline:3px solid var(--accent);outline-offset:1px}
/* 공용판 */
.table{background:var(--table);border:1px solid var(--table-line);border-radius:16px;padding:14px 12px;display:flex;flex-wrap:wrap;gap:14px 14px;align-content:flex-start;min-height:330px;box-shadow:inset 0 1px 0 #fff8}
.meld{display:flex;gap:1px;padding:3px;border-radius:7px;cursor:pointer;border:1px solid transparent}
.meld.focus{border-color:var(--accent);background:#ffffff8c}
.meld .tile{width:27px;height:36px}
.table.mini{min-height:0;padding:9px 8px;gap:8px 8px;border-radius:14px}
.table.mini .meld{padding:1px}
.table.mini .meld .tile{width:23px;height:31px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 6px}.sec h2{margin:0;font-size:15px}.sec a{font-size:14px;color:var(--accent);text-decoration:none;min-height:32px;display:inline-flex;align-items:center}
.mine{margin-top:16px}
.aside{margin-top:12px;display:flex;align-items:center;gap:10px}
.aside .spot{display:flex;gap:1px;padding:5px;border:1.5px dashed var(--table-line);border-radius:9px;background:var(--table);min-height:46px;min-width:46px}
.aside .spot .tile{width:27px;height:36px}
.aside span{font-size:13px;color:var(--muted)}
/* 받침대: 기존 common.rack 자산을 가로로 늘려 받침으로 사용 */
.rack{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.rack-row{position:relative;padding:0 10px 22px;display:flex;gap:3px;justify-content:center}
.rack-row .tile{width:43px;height:57px;position:relative;z-index:1}
.rack-row .ledge{position:absolute;left:0;right:0;bottom:0;height:56px;z-index:0}
.rack-row .ledge svg{width:100%;height:100%;display:block}
.empty{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 10px 8px;text-align:center}
.empty h2{margin:0;font-size:19px}
.empty .rack-row{width:100%;min-height:80px}
/* 하단 최소 제어 */
.bar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;padding:12px 14px 22px;background:linear-gradient(#eef3fa00,var(--bg) 26%)}
.btn{min-height:48px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface);display:flex;align-items:center;justify-content:center;gap:7px;font-size:15px;font-weight:600;padding:0 14px;cursor:pointer}
.btn svg{width:19px;height:19px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.grow{flex:1}
/* 확대 시트 */
.scrim{position:absolute;inset:0;background:rgba(20,33,61,.28)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 16px 22px;box-shadow:0 -10px 30px rgba(20,33,61,.18)}
.grip{width:40px;height:5px;border-radius:3px;background:var(--line-2);margin:0 auto 8px}
.sheet-head{display:flex;align-items:center;justify-content:space-between}
.sheet-head h3{margin:0;font-size:16px}
.big{display:flex;gap:4px;overflow-x:auto;padding:12px 2px 14px}
.big .tile{width:52px;height:69px}
.big .add{width:52px;height:69px;border:1.5px dashed var(--line-2);border-radius:7px;background:var(--surface-2);display:grid;place-items:center;flex-shrink:0;cursor:pointer}
.edit{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.colors{display:flex;gap:8px}
.colors button{flex:1;height:46px;border-radius:12px;border:1.5px solid var(--line-2);background:#fff9e9;font:700 22px Georgia,serif;cursor:pointer}
.colors button[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.nums{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.nums button{height:40px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-size:15px;font-weight:600;cursor:pointer;padding:0}
.nums button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.moves{display:flex;gap:8px}
.moves .btn{min-height:44px;flex:1;font-weight:500}
</style>
</head>
<body>
<nav class="states" aria-label="시안 상태">
 <a href="#public">공용판</a><a href="#public-zoom">공용판 · 확대</a><a href="#rack">내 화면 (공용판+받침대)</a><a href="#rack-zoom">내 받침대 · 확대</a><a href="#rack-empty">받침대 · 첫 사진 전</a>
</nav>
<div class="phone" id="phone"></div>
<p class="disclose">합성 시안 데이터예요. 사진 속 위치가 아니라 저장된 묶음·줄과 타일 순서대로 배치해요. 타일·받침대 그림은 기존 자산(numbers.number-tile, jokers.joker-tile, common.rack)을 그대로 씁니다.</p>

<script>
const ART='/game-art/games/rummikub/';
const COLOR={red:'var(--red)',blue:'var(--blue)',black:'var(--black)',orange:'var(--orange)'};
const NAME={red:'빨강',blue:'파랑',black:'검정',orange:'주황'};
// 합성 데이터: Classic 4색만. j=조커, n:null=숫자 모름
const t=(c,n)=>({c,n}),J={j:true};
const PUBLIC=[
 [t('red',3),t('red',4),t('red',5),t('red',6)],
 [t('red',7),t('blue',7),t('black',7),t('orange',7)],
 [t('blue',9),t('blue',10),t('blue',11),t('blue',12),t('blue',13)],
 [t('blue',1),t('black',1),t('orange',1)],
 [t('black',5),t('black',6),t('black',7),J],
 [t('orange',10),t('orange',11),t('orange',12)],
 [t('red',11),t('blue',11),t('black',11),t('orange',11)],
 [t('orange',2),t('orange',3),t('orange',4),t('orange',5),t('orange',6)],
 [t('black',8),t('black',9),t('black',10)],
];
const LOOSE=[t('red',13)];
const RACK=[
 [t('red',1),t('red',2),t('blue',4),t('blue',5),t('black',9),t('black',12),t('orange',8)],
 [t('orange',9),t('red',10),t('blue',2),t('black',3),t('orange',13),J,t('blue',null)],
];
const ic={
 back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7M19 12H5"/></svg>',
 cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>',
 zoom:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3M11 8v6M8 11h6"/></svg>',
 save:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7M7 3v4a1 1 0 0 0 1 1h7"/></svg>',
 lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/></svg>',
 x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
 plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="22" height="22"><path d="M12 5v14M5 12h14"/></svg>',
};
// 기존 타일 자산을 <use>로 불러오고, 앱(rt-face-number)과 같은 방식으로 가운데 '?' 위에 숫자를 얹는다.
function tile(x,sel){
 const label=x.j?'조커':`${NAME[x.c]} ${x.n??'숫자 모름'}`;
 const art=x.j?`<use href="${ART}jokers.joker-tile.svg#ga--rummikub--jokers--joker-tile"/>`
  :`<use href="${ART}numbers.number-tile.svg#ga--rummikub--numbers--number-tile"/>`+(x.n==null?'':`<rect x="27" y="22" width="62" height="64" fill="#fff9e9"/><text x="58" y="75" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="${x.n>9?46:54}" fill="${COLOR[x.c]}">${x.n}</text>`);
 return `<span class="tile${sel?' sel':''}" role="img" aria-label="${label}"><svg viewBox="19 7 81 107">${art}</svg></span>`;
}
const ledge=`<span class="ledge" aria-hidden="true"><svg viewBox="8 34 102 78" preserveAspectRatio="none"><use href="/game-art/common/rack.svg#ga--common--rack"/></svg></span>`;
const players=[{n:'하나',c:'#be443a'},{n:'민수',c:'#286eb6'},{n:'지우',c:'#ce7525'}];

function frame(owner,content,bar,overlay=''){
 return `<header class="top"><button class="icon" aria-label="내 보드로">${ic.back}</button><div class="title"><h1>토요일의 루미큐브</h1><p>3명 · 2분 전 저장</p></div>${owner?`<button class="icon" aria-label="비밀번호 걸기 (선택)">${ic.lock}</button>`:''}</header>
 <div class="tabs" role="tablist"><button role="tab" aria-selected="${!owner}" data-go="public">공용판</button>${players.map((p,i)=>`<button role="tab" aria-selected="${owner&&i===0}" data-go="rack"><span class="dot" style="background:${p.c}"></span>${p.n}</button>`).join('')}</div>
 <main class="body">${content}</main><div class="bar">${bar}</div>${overlay}`;
}
function sheet(title,tiles,sel){
 const s=tiles[sel];
 return `<div class="scrim" data-go="${location.hash.startsWith('#rack')?'rack':'public'}"></div><section class="sheet" aria-label="${title} 확대"><div class="grip"></div>
 <div class="sheet-head"><h3>${title}</h3><button class="icon" aria-label="닫기" data-go="${location.hash.startsWith('#rack')?'rack':'public'}">${ic.x}</button></div>
 <div class="big">${tiles.map((x,i)=>tile(x,i===sel)).join('')}<button class="add" aria-label="타일 추가">${ic.plus}</button></div>
 <div class="edit">
  <div class="colors" role="group" aria-label="색">${Object.keys(NAME).map(c=>`<button aria-label="${NAME[c]}" aria-pressed="${!s.j&&s.c===c}" style="color:${COLOR[c]}">${s.n??'?'}</button>`).join('')}</div>
  <div class="nums" role="group" aria-label="숫자">${[...Array(13)].map((_,i)=>`<button aria-pressed="${!s.j&&s.n===i+1}">${i+1}</button>`).join('')}<button aria-pressed="${!!s.j}" aria-label="조커">◡</button><button aria-pressed="${!s.j&&s.n==null}" aria-label="숫자 모름">?</button><button aria-label="뒷면">▯</button></div>
  <div class="moves"><button class="btn">◀ 앞으로</button><button class="btn">뒤로 ▶</button><button class="btn">빼기</button></div>
  <button class="btn primary">완료</button>
 </div></section>`;
}
function render(){
 const h=(location.hash||'#public').slice(1);
 document.querySelectorAll('.states a').forEach(a=>a.setAttribute('aria-current',a.getAttribute('href')==='#'+h));
 const owner=h.startsWith('rack'),zoom=h.endsWith('zoom');
 let content,bar,overlay='';
 if(!owner){
  content=`<div class="table" aria-label="공용판">${PUBLIC.map((m,i)=>`<div class="meld${zoom&&i===4?' focus':''}" data-go="public-zoom" aria-label="묶음 ${i+1}">${m.map(x=>tile(x)).join('')}</div>`).join('')}</div>
  <div class="aside"><div class="spot">${LOOSE.map(x=>tile(x)).join('')}</div><span>따로 둔 타일</span></div>`;
  bar=`<button class="btn">${ic.cam}판 찍기</button><button class="btn grow" data-go="public-zoom">${ic.zoom}확대</button><button class="btn primary">${ic.save}저장</button>`;
  if(zoom)overlay=sheet('묶음 5',PUBLIC[4],2);
 }else if(h==='rack-empty'){
  content=`<div class="empty"><h2>내 받침대를 찍어 주세요</h2><div class="rack-row">${ledge}</div><button class="btn primary" style="width:100%">${ic.cam}받침대 찍기</button><button class="btn" style="width:100%">직접 놓기</button></div>`;
  bar='';
 }else{
  content=`<div class="sec"><h2>공용판</h2><a href="#public" data-go="public">크게 보기</a></div><div class="table mini" aria-label="공용판 개요">${PUBLIC.map((m,i)=>`<div class="meld" data-go="public" aria-label="묶음 ${i+1}">${m.map(x=>tile(x)).join('')}</div>`).join('')}<div class="meld" style="border:1.5px dashed var(--table-line)" aria-label="따로 둔 타일">${LOOSE.map(x=>tile(x)).join('')}</div></div>
  <div class="sec mine"><h2>내 받침대</h2></div><div class="rack" aria-label="내 받침대">${RACK.map((row,r)=>`<div class="rack-row" data-go="rack-zoom" aria-label="${r+1}번째 줄">${row.map((x,i)=>tile(x,zoom&&r===0&&i===4)).join('')}${ledge}</div>`).join('')}</div>`;
  bar=`<button class="btn">${ic.cam}받침대 찍기</button><button class="btn grow" data-go="rack-zoom">${ic.zoom}확대</button><button class="btn primary">${ic.save}저장</button>`;
  if(zoom)overlay=sheet('첫째 줄',RACK[0],4);
 }
 document.getElementById('phone').innerHTML=frame(owner,content,bar,overlay);
}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){e.preventDefault();location.hash=g.dataset.go;}});
addEventListener('hashchange',render);render();
</script>
</body>
</html>
