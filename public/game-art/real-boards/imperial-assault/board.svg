<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"><rect x="3" y="3" width="994" height="994" rx="22" fill="#f4faff" stroke="#16305c" stroke-width="2"/><text x="325" y="35" text-anchor="middle" font-size="18" fill="#16305c">현재 캠페인 임무 · 실물 지도 기준</text><g id="area-map"><rect x="25" y="80" width="600" height="780" rx="10" fill="#eaf5fd" stroke="#16305c" stroke-width="2"/><text x="325.0" y="102" text-anchor="middle" font-size="12" fill="#16305c">현재 임무 지도 · 실물 사진 기준</text></g><g id="area-deployed-cards"><rect x="660" y="55" width="315" height="150" rx="10" fill="#eaf5fd" stroke="#16305c" stroke-width="2"/><text x="817.5" y="77" text-anchor="middle" font-size="12" fill="#16305c">공개 배치 카드 · 소진은 회전</text></g><g id="area-group-reserve"><rect x="660" y="230" width="150" height="130" rx="10" fill="#eaf5fd" stroke="#16305c" stroke-width="2"/><text x="735.0" y="252" text-anchor="middle" font-size="10" fill="#16305c">공개된 부대·상태</text></g><g id="area-threat-round"><rect x="825" y="230" width="150" height="130" rx="10" fill="#eaf5fd" stroke="#16305c" stroke-width="2"/><text x="900.0" y="252" text-anchor="middle" font-size="10" fill="#16305c">현재 위협·라운드 표식</text></g><g id="area-map-damage"></g><g id="area-hero-sheet"><rect x="660" y="420" width="165" height="190" rx="10" fill="#eaf5fd" stroke="#16305c" stroke-width="2"/><text x="742.5" y="442" text-anchor="middle" font-size="10" fill="#16305c">영웅 시트 · 건강/부상 앞뒷면</text></g><g id="area-activation"><rect x="840" y="420" width="135" height="65" rx="10" fill="#eaf5fd" stroke="#16305c" stroke-width="2"/><text x="907.5" y="442" text-anchor="middle" font-size="10" fill="#16305c">활성 표식 · 실제 앞뒷면</text></g><g id="area-damage"><rect x="840" y="505" width="135" height="90" rx="10" fill="#eaf5fd" stroke="#16305c" stroke-width="2"/><text x="907.5" y="527" text-anchor="middle" font-size="10" fill="#16305c">영웅 피해</text></g><g id="area-strain"><rect x="840" y="615" width="135" height="90" rx="10" fill="#eaf5fd" stroke="#16305c" stroke-width="2"/><text x="907.5" y="637" text-anchor="middle" font-size="10" fill="#16305c">영웅 스트레인</text></g><g id="area-weapon"><rect x="660" y="630" width="165" height="145" rx="10" fill="#eaf5fd" stroke="#16305c" stroke-width="2"/><text x="742.5" y="652" text-anchor="middle" font-size="10" fill="#16305c">공개 무기 카드</text></g><g id="area-class"><rect x="660" y="795" width="165" height="160" rx="10" fill="#eaf5fd" stroke="#16305c" stroke-width="2"/><text x="742.5" y="817" text-anchor="middle" font-size="10" fill="#16305c">공개 직업 카드·사용 표식</text></g><g id="area-equipment"><rect x="840" y="725" width="135" height="125" rx="10" fill="#eaf5fd" stroke="#16305c" stroke-width="2"/><text x="907.5" y="747" text-anchor="middle" font-size="10" fill="#16305c">장비·물자·보상</text></g><g id="area-conditions"><rect x="840" y="870" width="135" height="85" rx="10" fill="#eaf5fd" stroke="#16305c" stroke-width="2"/><text x="907.5" y="892" text-anchor="middle" font-size="10" fill="#16305c">영웅 상태 카드·토큰</text></g><text x="820" y="395" text-anchor="middle" font-size="15" fill="#16305c">영웅 공개 구역 · 실제 소유자별</text><text x="325" y="895" text-anchor="middle" font-size="13" fill="#16305c">확인된 검은 벽만 전사 · 다른 벽/이동 합법성 미판정</text><text x="325" y="920" text-anchor="middle" font-size="12" fill="#16305c">원래 기물·피해·활성·숨은 카드 값을 생성하지 않음</text><text x="325" y="946" text-anchor="middle" font-size="12" fill="#16305c">개인/공용 기록은 별도 필드로 보존</text></svg>
