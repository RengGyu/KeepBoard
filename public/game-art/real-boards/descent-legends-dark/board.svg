<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"><rect x="3" y="3" width="994" height="994" rx="9" fill="#f5fbff" stroke="#16305c" stroke-width="2"/><text x="500" y="30" font-family="sans-serif" text-anchor="middle" font-size="19" fill="#16305c">Descent · 어둠의 전설 기본판 · 현재 실물 기록</text><g id="area-map"><rect x="25" y="60" width="640" height="520" rx="9" fill="#eaf5fd" stroke="#16305c" stroke-width="2"/><text x="345.0" y="80" font-family="sans-serif" text-anchor="middle" font-size="14" fill="#16305c">앱의 현재 다층 지도 · 실제 위치 기록</text></g><g id="area-roll"><rect x="700" y="390" width="275" height="190" rx="9" fill="#eaf5fd" stroke="#16305c" stroke-width="2"/><text x="837.5" y="410" font-family="sans-serif" text-anchor="middle" font-size="11" fill="#16305c">현재 주사위·공개 처리 토큰</text></g><g id="area-hero-card"><rect x="25" y="660" width="220" height="170" rx="9" fill="#eaf5fd" stroke="#16305c" stroke-width="2"/><text x="135.0" y="680" font-family="sans-serif" text-anchor="middle" font-size="11" fill="#16305c">영웅 카드 · 현재 보이는 면</text><rect id="slot-hero-card" x="50" y="705" width="170" height="110" rx="9" fill="white" stroke="#16305c" stroke-width="2"/><text x="135.0" y="760.0" font-family="sans-serif" text-anchor="middle" font-size="12" fill="#16305c">영웅 카드</text></g><g id="area-attack-sleeve"><rect x="265" y="660" width="180" height="250" rx="9" fill="#eaf5fd" stroke="#16305c" stroke-width="2"/><text x="355.0" y="680" font-family="sans-serif" text-anchor="middle" font-size="11" fill="#16305c">공격 카드 슬리브 · 실물2장</text><rect id="slot-attack-sleeve" x="295" y="700" width="120" height="170" rx="9" fill="white" stroke="#16305c" stroke-width="2"/><rect x="303" y="712" width="90" height="135" rx="9" fill="#fff0c8" stroke="#16305c" stroke-width="2"/><rect x="316" y="724" width="90" height="135" rx="9" fill="#fffdf5" stroke="#16305c" stroke-width="2"/><text x="355.0" y="845" font-family="sans-serif" text-anchor="middle" font-size="8" fill="#16305c">실물 A / B · 현재 면 직접 확인</text></g><g id="area-skills"><rect x="465" y="660" width="230" height="150" rx="9" fill="#eaf5fd" stroke="#16305c" stroke-width="2"/><text x="580.0" y="680" font-family="sans-serif" text-anchor="middle" font-size="11" fill="#16305c">기술 카드 · 피로/조건 개별 기록</text></g><g id="area-equipment"><rect x="715" y="660" width="260" height="150" rx="9" fill="#eaf5fd" stroke="#16305c" stroke-width="2"/><text x="845.0" y="680" font-family="sans-serif" text-anchor="middle" font-size="11" fill="#16305c">방어구·장신구·소모품</text></g><g id="area-health"><rect x="25" y="850" width="220" height="125" rx="9" fill="#eaf5fd" stroke="#16305c" stroke-width="2"/><text x="135.0" y="870" font-family="sans-serif" text-anchor="middle" font-size="11" fill="#16305c">체력 다이얼·현재 표식</text></g><g id="area-reference"><rect x="265" y="930" width="180" height="45" rx="9" fill="#eaf5fd" stroke="#16305c" stroke-width="2"/><text x="355.0" y="950" font-family="sans-serif" text-anchor="middle" font-size="11" fill="#16305c">개인 참조 카드</text></g><g id="area-conditions"><rect x="465" y="830" width="230" height="145" rx="9" fill="#eaf5fd" stroke="#16305c" stroke-width="2"/><text x="580.0" y="850" font-family="sans-serif" text-anchor="middle" font-size="11" fill="#16305c">피로·조건 · 대상 카드와 연결</text></g><g id="area-injury"><rect x="715" y="830" width="260" height="145" rx="9" fill="#eaf5fd" stroke="#16305c" stroke-width="2"/><text x="845.0" y="850" font-family="sans-serif" text-anchor="middle" font-size="11" fill="#16305c">부상 카드 · 현재 보이는 면</text></g><text x="345" y="140" font-family="sans-serif" text-anchor="middle" font-size="17" fill="#16305c">실제 타일·계단·피겨의 위치와 층을 기록</text><text x="345" y="170" font-family="sans-serif" text-anchor="middle" font-size="13" fill="#16305c">앱의 현재 지도/사진을 기준으로 직접 배치</text><text x="345" y="205" font-family="sans-serif" text-anchor="middle" font-size="12" fill="#16305c">아직 퀘스트 타일의 전체 형상·연결을 전사하지 않음</text><text x="345" y="540" font-family="sans-serif" text-anchor="middle" font-size="12" fill="#16305c">층 미확인은 임의로1층에 넣지 않음</text><text x="500" y="625" font-family="sans-serif" text-anchor="middle" font-size="15" fill="#16305c">아래 개인판은 실제 소유자별 · 자동 장비/시작 상태 생성 없음</text><g id="elevation-reference"><rect x="700" y="60" width="275" height="300" rx="9" fill="#fff8e4" stroke="#16305c" stroke-width="2"/><text x="837" y="82" font-family="sans-serif" text-anchor="middle" font-size="12" fill="#16305c">높이 구조 참고 · 현재 지도 아님</text><rect x="750" y="120" width="22" height="210" rx="3" fill="#b6c8d9" stroke="#16305c" stroke-width="2"/><rect x="730" y="300" width="210" height="6" rx="0" fill="#8fd3ff" stroke="#16305c" stroke-width="2"/><text x="950" y="305" font-family="sans-serif" text-anchor="middle" font-size="10" fill="#16305c">층1</text><rect x="730" y="230" width="210" height="6" rx="0" fill="#8fd3ff" stroke="#16305c" stroke-width="2"/><text x="950" y="235" font-family="sans-serif" text-anchor="middle" font-size="10" fill="#16305c">층2</text><rect x="730" y="160" width="210" height="6" rx="0" fill="#8fd3ff" stroke="#16305c" stroke-width="2"/><text x="950" y="165" font-family="sans-serif" text-anchor="middle" font-size="10" fill="#16305c">층3</text><polygon points="835,300 835,278 858,278 858,255 881,255 881,232 905,232 905,300" fill="#ffc935" stroke="#16305c" stroke-width="2"/><text x="864" y="338" font-family="sans-serif" text-anchor="middle" font-size="10" fill="#16305c">계단3단 · 기둥으로 위 타일 지지</text></g></svg>
