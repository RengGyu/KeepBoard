<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KeepBoard · 아트 PNG 내보내기</title><style>body{margin:24px;background:#f8f5eb;color:#33483c;font:14px -apple-system,sans-serif}button,a{display:inline-block;padding:12px;color:inherit}button{background:#fff9e9;border:1px solid #9ca88c;border-radius:4px;cursor:pointer}img{display:block;max-width:100%;height:auto;margin-top:24px}a[hidden]{display:none}</style><h1>대표 시트 PNG</h1><p id="status">원본 SVG를 브라우저에서 1440px PNG로 렌더합니다.</p><button id="render">PNG 렌더</button><a id="download" hidden>PNG 파일 저장</a><img id="png-preview" alt="브라우저에서 렌더한 대표 시트" hidden><script>
document.getElementById('render').addEventListener('click',async()=>{try{const checkpoint=new URLSearchParams(location.search).get('checkpoint')||'020';if(!/^(020|040|060|080|100|120)$/.test(checkpoint))throw Error('지원하는 체크포인트가 아닙니다.');const response=await fetch(`checkpoints/${checkpoint}-representative.svg`);if(!response.ok)throw Error('SVG를 찾을 수 없습니다.');const source=await response.text();const doc=new DOMParser().parseFromString(source,'image/svg+xml');const width=Number(doc.documentElement.getAttribute('width'));const height=Number(doc.documentElement.getAttribute('height'));const img=new Image();const uri=URL.createObjectURL(new Blob([source],{type:'image/svg+xml'}));img.src=uri;await img.decode();const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;canvas.getContext('2d').drawImage(img,0,0);URL.revokeObjectURL(uri);const png=canvas.toDataURL('image/png');if(new URLSearchParams(location.search).get('save')==='1'){const saved=await fetch('/capture/'+checkpoint,{method:'POST',body:png});if(!saved.ok)throw Error('로컬 PNG 저장 실패');}const preview=document.getElementById('png-preview');preview.src=png;preview.hidden=false;const link=document.getElementById('download');link.href=png;link.download=`${checkpoint}-representative.png`;link.hidden=false;document.getElementById('status').textContent=`${checkpoint}종 · ${width} × ${height}px PNG 렌더 완료`;}catch(e){document.getElementById('status').textContent='오류: '+e.message;}});
</script></html>
